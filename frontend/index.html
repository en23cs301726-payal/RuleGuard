<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuleGuard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            min-height: 100vh;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            color: #d1d5db;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            resize: vertical;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 30px;
            display: none;
        }

        .status {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .answer {
            background: #f9fafb;
            padding: 20px;
            border-radius: 8px;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .citation {
            margin-top: 15px;
            padding: 15px;
            background: #eef2ff;
            border-radius: 8px;
        }

        .citation strong {
            display: block;
            margin-bottom: 5px;
        }

        .error {
            color: #dc2626;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🛡️ RuleGuard</h1>
        <p>AI-Powered Academic Regulation Reasoning System</p>
    </div>

    <div class="container">

        <div class="card">

            <label>Ask a Question</label>

            <textarea
                id="question"
                placeholder="Example: What happens if a student misses an examination?"
            ></textarea>

            <button onclick="askQuestion()">Ask RuleGuard</button>

            <div id="error" class="error"></div>

            <div id="result">

                <div class="status">
                    Status: <span id="status"></span>
                </div>

                <h3>Answer</h3>
                <div class="answer" id="answer"></div>

                <h3 style="margin-top:25px;">Evidence</h3>
                <div id="citations"></div>

            </div>

        </div>

    </div>

    <script>

        async function askQuestion() {

            const question = document.getElementById("question").value.trim();

            if (!question) {
                document.getElementById("error").innerText =
                    "Please enter a question.";
                return;
            }

            document.getElementById("error").innerText = "";

            try {

                const response = await fetch("http://127.0.0.1:8000/ask", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        question: question
                    })
                });

                const data = await response.json();

                document.getElementById("result").style.display = "block";

                document.getElementById("status").innerText =
                    data.status.toUpperCase();

                document.getElementById("answer").innerText =
                    data.answer;

                const citationsDiv =
                    document.getElementById("citations");

                citationsDiv.innerHTML = "";

                if (data.citations && data.citations.length > 0) {

                    data.citations.forEach(citation => {

                        const div = document.createElement("div");

                        div.className = "citation";

                        div.innerHTML = `
                            <strong>Section:</strong>
                            ${citation.section}

                            <strong style="margin-top:10px;">
                                Source:
                            </strong>
                            ${citation.source}

                            <strong style="margin-top:10px;">
                                Similarity:
                            </strong>
                            ${citation.similarity.toFixed(4)}
                        `;

                        citationsDiv.appendChild(div);

                    });

                }

            } catch (error) {

                document.getElementById("error").innerText =
                    "Unable to connect to RuleGuard API. Make sure the FastAPI server is running.";

            }

        }

    </script>

</body>
</html>
